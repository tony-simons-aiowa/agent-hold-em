# Agent Hold 'Em — native Hermes plugin manifest.
#
# This is the plugin-catalog manifest that `hermes plugins validate` admits.
# The legacy dashboard manifest (dashboard/manifest.json) stays untouched: the
# Hermes web server discovers dashboard backends via
# `<plugin>/dashboard/manifest.json` and mounts `dashboard/plugin_api.py`
# through its `api` field.
#
# Capability surface: this plugin registers no tools, hooks, or middleware.
# Its backend is a FastAPI router mounted by the dashboard server, and its UI
# is the desktop bundle at desktop/plugin.js (see the `loadable` admission
# check). requires_hermes is intentionally not declared: no minimum Hermes
# version has been verified for the SDK surface this plugin imports.
name: agent-hold-em
version: 1.0.0
description: >-
  No-Limit Texas Hold 'Em: one human versus three real, isolated Hermes
  agents, right inside Hermes Desktop. Play chips only — this is a local
  single-player game, not a gambling product. Opponent decisions run through
  locally configured Hermes profiles and may consume provider tokens.
author: Tony Simons
license: MIT
kind: standalone
